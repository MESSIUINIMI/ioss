[Script]
# ======= Netflix 评分脚本 =======
Netflix评分-Req = type=http-request, pattern=^https?://ios\.prod\.ftl\.netflix\.com/iosui/user/.+path=%5B%22videos%22%2C%\d+%22%2C%22summary%22%5D, script-path=https://raw.githubusercontent.com/yichahucha/surge/master/nf_rating.js
Netflix评分-Res = type=http-response, pattern=^https?://ios\.prod\.ftl\.netflix\.com/iosui/user/.+path=%5B%22videos%22%2C%\d+%22%2C%22summary%22%5D, requires-body=1, max-size=-1, script-path=https://raw.githubusercontent.com/yichahucha/surge/master/nf_rating.js
Netflix单集评分 = type=http-response, pattern=^https?://ios\.prod\.ftl\.netflix\.com/iosui/warmer/.+type=show-ath, requires-body=1, max-size=-1, script-path=https://raw.githubusercontent.com/yichahucha/surge/master/nf_rating_season.js

# ======= BoxJs =======
BoxJs = type=http-request, pattern=^https?:\/\/(.+\.)?boxjs\.(com|net|org|tf), requires-body=1, max-size=-1, script-path=https://raw.githubusercontent.com/chavyleung/scripts/master/box/chavy.boxjs.js

X网页版标签页 = type=http-response,engine=jsc,script-path=https://raw.githubusercontent.com/fmz200/wool_scripts/main/Scripts/X/XWebEnhance.js,pattern=^https?:\/\/x\.com\/i\/api\/graphql\/[^\/]+\/PinnedTimelines\?,max-size=131072,requires-body=true,timeout=10,script-update-interval=86400,enable=true


[MITM]
# 证书解密主机名列表
hostname = ios.prod.ftl.netflix.com,*.google.cn, boxjs.com, boxjs.net, x.com
skip-server-cert-verify = true
enable = true
