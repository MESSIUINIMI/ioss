
# ================ 锚点定义 ================

# proxy-provider 公共参数
p: &p {type: http, interval: 86400, health-check: {enable: true, url: https://www.gstatic.com/generate_204, interval: 300, timeout: 5000, lazy: true}}

# proxy-group select 公共代理列表
pg: &pg
  type: select
  proxies: 
    - 🇹🇼 TW
    - 🇸🇬 SG
    - 🇯🇵 JP
    - 🇺🇸 US
    - 🇰🇷 KR
    - 🇬🇧 UK
    - 🇩🇪 DE
    - 🇫🇷 FR
    - 🇦🇺 AU
    - 🇧🇷 BR
    - 🇮🇳 IN
    - 🇳🇱 NL
    - 🇹🇭 TH
    - 🇨🇦 CA
    - 🇹🇷 TR
    - 🇿🇦 ZA
    - 🇦🇪 AE
    - 🧐 Select

# url-test 公共参数
ut: &ut {type: url-test, include-all: true, url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 0, lazy: true}

# rule-provider 公共参数（mrs 格式，性能最优）
rp: &rp {type: http, behavior: domain, format: mrs, interval: 86400, proxy: 🇺🇸 US}

# ================ 基础配置 ================

mixed-port: 27753
# redir-port: 27862
# tproxy-port: 27863

allow-lan: true
bind-address: '*'
mode: rule

authentication:
  - "Ambition9651:9CCFufjvS&@R&*58@"
skip-auth-prefixes:
  - 127.0.0.1/8
  - ::1/128
  - 192.168.1.0/24

log-level: info
ipv6: true
find-process-mode: strict

geodata-mode: true
tcp-concurrent: true
unified-delay: true

geo-auto-update: true
geo-update-interval: 24

geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/Loyalsoldier/geoip/releases/latest/download/Country.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

external-controller: 127.0.0.1:9090
# secret: "Ambition9651APISecret"
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true
external-ui: ab
# external-ui-name: ab
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true    # 对 redir-host 流量强制嗅探
  parse-pure-ip: true        # 对纯 IP 流量强制嗅探
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
  skip-domain:
    - Mijia Cloud

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-detect-interface: true
  auto-route: true
  strict-route: true

dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: true
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  listen: 0.0.0.0:53
  ipv6: true

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'localhost.ptlogin2.qq.com'
    

  nameserver-policy:
    '+.arpa': '223.5.5.5'
    'rule-set:cn':
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query#h3=true
      - quic://223.6.6.6
    'geosite:category-ads-all': rcode://success
    'rule-set:Ad': rcode://success

  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query#h3=true
    - quic://223.6.6.6

  fallback:
    - https://8.8.8.8/dns-query#🖲 Proxy&h3=true
    - https://1.1.1.1/dns-query#🖲 Proxy&h3=true
    - tls://9.9.9.10:853

  proxy-server-nameserver:
    - https://doh.pub/dns-query

  # direct-nameserver:
  #  - system
  # direct-nameserver-follow-policy: false

  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
      - geolocation-!cn
    ipcidr:
      - 240.0.0.0/4
    domain:
      - '+.google.com'
      - '+.facebook.com'
      - '+.youtube.com'

